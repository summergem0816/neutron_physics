target: trainers.lit_ae.LitAE
params:
  misc_config:
    compile: True
    warmup: 5000

  optimizer_config:
    target: torch.optim.Adam
    params:
      lr: !!float 1e-4
      weight_decay: 0.
      betas: [0.5, 0.9]
      eps: !!float 1e-8

  scheduler_config:
    target: torch.optim.lr_scheduler.CosineAnnealingLR
    params:
      T_max: 100000
      eta_min: !!float 1e-7

  ae_config:
    lpips_loss_scale: 0
    physics_loss_scale: 1.0
    global_deg_reg_scale: 0.0
    local_deg_reg_scale: 0.0
    t_learnable: True
    test_y_channel: True

  model_config:
    target: models.ae.Autoencoder
    params:
      in_dim: 3
      base_dim: 256
      latent_dim: 4
      use_skip: True
      global_deg_dim: 256
      local_deg_dim: 4
      encoder_kernel_size: 13
      generator_kernel_size: 3
      n_feats_map: 16

  physics_config:
    target: models.neutron.physics_forward.NeutronPhysicalForward
    params:
      geo_kernel_size: 21
      det_kernel_size: 15
      scatter_kernel_size: 81
      theta_div_deg: 1.0
      object_detector_distance_mm: 50.0
      detector_pitch_mm: 0.66
      detector_pixel_width_mm: 0.6
      scintillator_sigma_px_init: 0.35
      flux_ref_max: 300000000.0
      particle_count_min: 10000000.0
      particle_count_max: 300000000.0
      scatter_strength_max: 0.08
      readout_sigma_max: 0.01
      latent_modulation_scale: 0.15
      latent_channels: 4
      trainable_blur: True
      trainable_noise_heads: True
      shared_channel_stochastic: True
      force_grayscale: True
