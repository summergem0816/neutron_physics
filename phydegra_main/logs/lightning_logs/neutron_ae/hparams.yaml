misc_config:
  compile: true
  warmup: 5000
optimizer_config:
  target: torch.optim.Adam
  params:
    lr: 0.0001
    weight_decay: 0.0
    betas:
    - 0.5
    - 0.9
    eps: 1.0e-08
ae_config:
  lpips_loss_scale: 0
  physics_loss_scale: 1.0
  t_learnable: false
  test_y_channel: true
model_config:
  target: models.ae.Autoencoder
  params:
    in_dim: 3
    base_dim: 128
    latent_dim: 4
    use_skip: true
physics_config:
  target: models.neutron.physics_forward.NeutronPhysicalForward
  params:
    blur_kernel_size: 21
    blur_sigma_min: 0.8
    blur_sigma_max: 2.5
    scatter_kernel_size: 81
    scatter_sigma: 12.0
    scatter_strength_max: 0.08
    readout_sigma_max: 0.01
    flux_min: 10000.0
    flux_max: 300000.0
scheduler_config:
  target: torch.optim.lr_scheduler.CosineAnnealingLR
  params:
    T_max: 100000
    eta_min: 1.0e-07
