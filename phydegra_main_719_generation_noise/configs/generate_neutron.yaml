lightning:
  seed: ~
  trainer:
    accelerator: auto
    precision: 32
    devices: [0]
    strategy: auto

data:
  target: datasets.data_module.GenerationDataModule
  params:
    dataset:
      target: datasets.neutron_deg.NeutronTrajectoryDataset
      params:
        dataroot: "./dataset_1/train"
        hq_subdir: "HQ"
        lq_subdir: "LQ"
        augmentation: False
        test: True
        preload: False
    data_loader:
      batch_size: 1
      shuffle: false
      num_workers: 2
      drop_last: false

model:
  target: trainers.lit_generate.LitGenerator
  params:
    mode: "flow"
    version: "neutron"
    root_dir: "./results/neutron"
    camera_type: "neutron"
    ae_config:
      target: models.ae.Autoencoder
      params:
        in_dim: 3
        base_dim: 256
        latent_dim: 4
        use_skip: True
        global_deg_dim: 256
        local_deg_dim: 4
        encoder_kernel_size: 13
        generator_kernel_size: 3
        n_feats_map: 16
      checkpoint: "Path_to_pretrained_neutron_autoencoder_checkpoint"

    rf_config:
      target: models.ncsn.ncsnpp.NCSNpp
      params:
        config:
          training:
            continuous: True
          data:
            centered: True
            image_size: 128
            num_channels: 4
          model:
            sigma_max: 50.
            sigma_min: 0.01
            num_scales: 1000
            beta_min: 0.1
            beta_max: 20.
            dropout: 0.1
            scale_by_sigma: False
            ema_rate: 0.999
            normalization: "GroupNorm"
            nonlinearity: "swish"
            nf: 128
            ch_mult: [1, 2, 2, 2]
            num_res_blocks: 4
            attn_resolutions: []
            resamp_with_conv: True
            conditional: True
            fir: False
            fir_kernel: [1, 3, 3, 1]
            skip_rescale: True
            resblock_type: "biggan"
            progressive: "none"
            progressive_input: "none"
            progressive_combine: "sum"
            attention_type: "ddpm"
            init_scale: 0.
            embedding_type: "positional"
            fourier_scale: 16
            conv_size: 3
      checkpoint: "Path_to_pretrained_neutron_rectified_flow_checkpoint"

    physics_config:
      target: models.neutron.physics_forward.NeutronPhysicalForward
      params:
        geo_kernel_size: 21
        det_kernel_size: 15
        scatter_kernel_size: 81
        theta_div_deg: 1.0
        object_detector_distance_mm: 50.0
        detector_pitch_mm: 0.66
        detector_pixel_width_mm: 0.6
        scintillator_sigma_px_init: 0.35
        flux_ref_max: 300000000.0
        particle_count_min: 10000000.0
        particle_count_max: 300000000.0
        scatter_strength_max: 0.08
        readout_sigma_max: 0.01
        latent_modulation_scale: 0.15
        latent_channels: 4
        trainable_blur: True
        trainable_noise_heads: True
